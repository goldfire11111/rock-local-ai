<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rock - Local AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M4 24 L10 9 L18 6 L27 13 L29 24 Z' fill='%23d4a373'/></svg>">
<style>
:root{
  --bg:#141312; --panel:#1c1a19; --panel2:#24221f; --line:#33302c; --text:#ece7e1; --dim:#9c958c;
  --accent:#d4a373; --accent2:#e9c46a; --danger:#e76f51; --ok:#8ab17d; --code:#0f0e0d;
  --r:12px; --font: "Segoe UI", system-ui, -apple-system, sans-serif; --mono: "Cascadia Code", Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.55 var(--font)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.app{display:grid;grid-template-columns:260px 1fr;height:100vh}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-weight:700;font-size:18px;letter-spacing:.3px}
.brand svg{width:26px;height:26px}
.brand small{font-weight:400;color:var(--dim);font-size:12px;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);transition:.15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#1a1410;border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.side .new{margin:6px 12px 10px}
.chats{flex:1;overflow:auto;padding:0 8px}
.chat-item{display:flex;align-items:center;padding:8px 10px;border-radius:8px;color:var(--dim);cursor:pointer;gap:6px;font-size:14px}
.chat-item:hover{background:var(--panel2);color:var(--text)}
.chat-item.active{background:var(--panel2);color:var(--text)}
.chat-item span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chat-item .x{opacity:0;padding:0 4px}
.chat-item:hover .x{opacity:.6}
.chat-item .x:hover{opacity:1;color:var(--danger)}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.status{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.dot.warn{background:var(--accent2)}
/* main */
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line)}
.top select{min-width:240px}
.top .spacer{flex:1}
.msgs{flex:1;overflow:auto;padding:24px 0}
.wrap{max-width:820px;margin:0 auto;padding:0 24px}
.msg{margin:0 0 22px;display:flex;gap:12px}
.msg .av{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700}
.msg.user .av{background:#3a352f}
.msg.assistant .av{background:linear-gradient(135deg,var(--accent),#a0522d);color:#1a1410}
.msg .body{flex:1;min-width:0}
.msg .who{font-size:12px;color:var(--dim);margin-bottom:2px}
.msg.user .content{white-space:pre-wrap}
.content p{margin:.4em 0}
.content pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;position:relative;font:13px/1.5 var(--mono)}
.content code{font:13px var(--mono);background:var(--panel2);padding:1px 5px;border-radius:5px}
.content pre code{background:none;padding:0}
.content pre .copy{position:absolute;top:6px;right:6px;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--panel2);color:var(--dim);opacity:0}
.content pre:hover .copy{opacity:1}
.content table{border-collapse:collapse;margin:.5em 0}
.content td,.content th{border:1px solid var(--line);padding:4px 10px}
.content h1,.content h2,.content h3{margin:.8em 0 .3em;line-height:1.25}
.content h1{font-size:1.4em}.content h2{font-size:1.2em}.content h3{font-size:1.05em}
.content a{color:var(--accent)}
.content blockquote{border-left:3px solid var(--line);margin:.5em 0;padding-left:12px;color:var(--dim)}
.content ul,.content ol{padding-left:1.4em;margin:.4em 0}
.think{border:1px solid var(--line);border-radius:10px;margin:4px 0 8px;background:var(--panel)}
.think summary{cursor:pointer;padding:6px 12px;color:var(--dim);font-size:13px;user-select:none}
.think div{padding:0 12px 10px;color:var(--dim);white-space:pre-wrap;font-size:13.5px;max-height:320px;overflow:auto}
.meta{font-size:12px;color:var(--dim);margin-top:4px;display:flex;gap:12px}
.meta button{color:var(--dim);font-size:12px}
.meta button:hover{color:var(--text)}
.imgs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.imgs img{max-height:120px;border-radius:8px;border:1px solid var(--line)}
.err{color:var(--danger);white-space:pre-wrap;font-size:13px;background:#2a1a16;border:1px solid #5a2e24;padding:8px 12px;border-radius:8px}
.cursor::after{content:"▍";animation:blink 1s steps(2) infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}
.empty{text-align:center;color:var(--dim);margin-top:12vh}
.empty h2{color:var(--text);font-weight:600;margin:12px 0 6px}
.empty svg{width:64px;height:64px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--dim)}
.chip:hover{border-color:var(--accent);color:var(--text)}
/* composer */
.composer{padding:10px 0 18px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px;display:flex;align-items:flex-end;gap:8px}
.box:focus-within{border-color:#57504a}
.box textarea{flex:1;border:0;background:none;resize:none;max-height:240px;padding:8px 0;line-height:1.5}
.box .icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--dim)}
.box .icon:hover{background:var(--panel2);color:var(--text)}
.send{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#1a1410;display:grid;place-items:center}
.send:disabled{opacity:.4}
.send.stop{background:var(--danger)}
.hint{font-size:11.5px;color:var(--dim);text-align:center;margin-top:6px}
.pending{display:flex;gap:6px;padding:4px 0 6px}
.pending .pi{position:relative}
.pending img{height:54px;border-radius:6px}
.pending .pi button{position:absolute;top:-6px;right:-6px;background:var(--danger);border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10}
.modal.open{display:flex}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(760px,94vw);max-height:88vh;display:flex;flex-direction:column}
.dialog header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:16px}
.dialog header button{margin-left:auto;font-size:20px;color:var(--dim)}
.dialog .inner{padding:16px 18px;overflow:auto}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:14px 0 8px}
.sec:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px}
.row:hover{background:var(--panel2)}
.row .n{font-weight:600}
.row .d{color:var(--dim);font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.prog{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:13px;color:var(--dim)}
.field .r{display:flex;gap:10px;align-items:center}
.field input[type=range]{flex:1;padding:0;accent-color:var(--accent)}
.flex{display:flex;gap:8px;align-items:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:9px 16px;border-radius:10px;display:none;z-index:20}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#3a3631;border-radius:6px;border:2px solid var(--bg)}
@media (max-width:800px){.app{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 32 32"><path d="M4 24 L10 9 L18 6 L27 13 L29 24 Z" fill="#d4a373"/><path d="M10 9 L14 17 L18 6 M14 17 L27 13 M14 17 L4 24 M14 17 L22 24" stroke="#1c1a19" stroke-width="1.4" fill="none"/></svg>
      Rock <small id="ver"></small>
    </div>
    <button class="btn new" id="newChat">＋ New chat</button>
    <div class="chats" id="chats"></div>
    <div class="side-foot">
      <button class="btn" id="openModels">▤ Models</button>
      <button class="btn" id="openSettings">⚙ Settings</button>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting...</span></div>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <select id="model"></select>
      <span class="tag" id="visionTag" style="display:none">vision</span>
      <div class="spacer"></div>
      <button class="btn" id="unload" title="Free GPU memory">⏏ Unload</button>
    </div>
    <div class="msgs" id="msgs"><div class="wrap" id="thread"></div></div>
    <div class="composer"><div class="wrap">
      <div class="pending" id="pending"></div>
      <div class="box">
        <button class="icon" id="attach" title="Attach image (vision models)">📎</button>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <textarea id="input" rows="1" placeholder="Message Rock..."></textarea>
        <button class="send" id="send" title="Send">➤</button>
      </div>
      <div class="hint">Runs 100% on this computer. Enter to send · Shift+Enter for a new line</div>
    </div></div>
  </main>
</div>

<div class="modal" id="modelsModal"><div class="dialog">
  <header>Models<button data-close>×</button></header>
  <div class="inner">
    <div class="sec">Installed</div>
    <div id="installed"></div>
    <div class="sec">Download from Hugging Face</div>
    <div class="flex">
      <input id="pullName" placeholder="e.g. qwen3:4b  or  unsloth/Qwen3-4B-GGUF:Q4_K_M" style="flex:1">
      <button class="btn primary" id="pullBtn">Download</button>
    </div>
    <div id="pullStatus" style="margin-top:8px"></div>
    <div class="sec">Add existing files</div>
    <div class="flex" style="flex-wrap:wrap">
      <button class="btn" id="importOllama">Import my Ollama models</button>
      <input id="importPath" placeholder="C:\path\to\model.gguf" style="flex:1;min-width:220px">
      <button class="btn" id="importBtn">Add file</button>
    </div>
    <div style="font-size:12.5px;color:var(--dim);margin-top:6px">Tip: you can also drop .gguf files into <code id="modelsDir"></code></div>
    <div class="sec">Catalog</div>
    <div id="catalog"></div>
  </div>
</div></div>

<div class="modal" id="settingsModal"><div class="dialog" style="width:min(560px,94vw)">
  <header>Settings<button data-close>×</button></header>
  <div class="inner">
    <div class="field"><label>System prompt</label><textarea id="sSystem" rows="4" placeholder="You are a helpful assistant."></textarea></div>
    <div class="field"><label>Temperature: <b id="sTempV"></b></label><div class="r"><input type="range" id="sTemp" min="0" max="2" step="0.05"></div></div>
    <div class="field"><label>Context length (tokens) - bigger uses more memory</label>
      <select id="sCtx"><option>2048</option><option>4096</option><option>8192</option><option>16384</option><option>32768</option><option>65536</option><option>131072</option></select></div>
    <div class="field"><label>Max response tokens (-1 = unlimited)</label><input type="number" id="sMax"></div>
    <div class="field"><label>Thinking (for reasoning models)</label>
      <select id="sThink"><option value="">Model default</option><option value="on">On</option><option value="off">Off</option></select></div>
    <div class="field"><label>Keep model loaded after use</label>
      <select id="sKeep"><option value="5m">5 minutes</option><option value="30m">30 minutes</option><option value="-1">Forever</option><option value="0">Unload immediately</option></select></div>
    <div style="font-size:12.5px;color:var(--dim)" id="engineInfo"></div>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem('rock.'+k)) ?? d } catch { return d } },
  set(k, v){ localStorage.setItem('rock.'+k, JSON.stringify(v)) }
};
let chats = store.get('chats', []);
let current = store.get('current', null);
let settings = Object.assign({system:'', temperature:0.7, ctx:8192, max:-1, think:'', keep:'5m'}, store.get('settings', {}));
let models = [];
let controller = null;
let pendingImages = [];

function toast(t, ms=2500){ const e=$('#toast'); e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none', ms) }
function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function fmtSize(n){ const u=['B','KB','MB','GB','TB']; let i=0; while(n>=1024&&i<4){n/=1024;i++} return n.toFixed(i>2?1:0)+' '+u[i] }

/* ---------- tiny markdown ---------- */
function md(src){
  const blocks = [];
  src = src.replace(/```([\w+-]*)[^\n]*\n([\s\S]*?)(```|$)/g, (_, lang, code) => {
    blocks.push(`<pre><button class="copy">copy</button><code data-lang="${esc(lang)}">${esc(code.replace(/\n$/,''))}</code></pre>`);
    return `\u0000${blocks.length-1}\u0000`;
  });
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = src.split('\n'); let out = ''; let list = null; let para = [];
  const flushP = () => { if (para.length){ out += '<p>' + para.map(inline).join('<br>') + '</p>'; para = [] } };
  const flushL = () => { if (list){ out += `</${list}>`; list = null } };
  for (let i=0;i<lines.length;i++){
    const l = lines[i];
    let m;
    if (/^\u0000\d+\u0000$/.test(l.trim())){ flushP(); flushL(); out += l.trim(); continue }
    if (!l.trim()){ flushP(); flushL(); continue }
    if ((m = l.match(/^(#{1,6})\s+(.*)/))){ flushP(); flushL(); const n=Math.min(m[1].length,3); out += `<h${n}>${inline(m[2])}</h${n}>`; continue }
    if (/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(l)){ flushP(); flushL(); out += '<hr>'; continue }
    if ((m = l.match(/^>\s?(.*)/))){ flushP(); flushL(); out += `<blockquote>${inline(m[1])}</blockquote>`; continue }
    if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|?\s*:?-{2,}/.test(lines[i+1]||'')){
      flushP(); flushL();
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));
      out += '<table><tr>' + cells(l).map(c=>`<th>${c}</th>`).join('') + '</tr>'; i++;
      while (i+1<lines.length && /^\s*\|.*\|\s*$/.test(lines[i+1])){ i++; out += '<tr>' + cells(lines[i]).map(c=>`<td>${c}</td>`).join('') + '</tr>' }
      out += '</table>'; continue;
    }
    if ((m = l.match(/^\s*([-*+]|\d+[.)])\s+(.*)/))){
      flushP(); const type = /\d/.test(m[1]) ? 'ol' : 'ul';
      if (list !== type){ flushL(); out += `<${type}>`; list = type }
      out += `<li>${inline(m[2])}</li>`; continue;
    }
    if (list && /^\s{2,}\S/.test(l)){ out = out.replace(/<\/li>$/, ' ' + inline(l.trim()) + '</li>'); continue }
    flushL(); para.push(l);
  }
  flushP(); flushL();
  return out.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}

/* ---------- chats ---------- */
function save(){ store.set('chats', chats); store.set('current', current) }
function chat(){ return chats.find(c => c.id === current) }
function newChat(){
  const c = { id: Date.now().toString(36), title: 'New chat', model: $('#model').value, messages: [] };
  chats.unshift(c); current = c.id; save(); renderChats(); renderThread(); $('#input').focus();
}
function renderChats(){
  $('#chats').innerHTML = chats.map(c => `<div class="chat-item ${c.id===current?'active':''}" data-id="${c.id}"><span>${esc(c.title)}</span><button class="x" data-del="${c.id}">✕</button></div>`).join('');
}
$('#chats').onclick = e => {
  const del = e.target.dataset.del;
  if (del){ chats = chats.filter(c => c.id !== del); if (current === del) current = chats[0]?.id || null; save(); renderChats(); renderThread(); return }
  const it = e.target.closest('.chat-item'); if (!it) return;
  current = it.dataset.id; save(); renderChats(); renderThread();
  const c = chat(); if (c?.model && models.some(m => m.name === c.model)) $('#model').value = c.model, onModelChange();
};
$('#newChat').onclick = newChat;

function msgHTML(m, i, streaming){
  const who = m.role === 'user' ? 'You' : (m.model || 'Assistant');
  let body = '';
  if (m.images?.length) body += `<div class="imgs">${m.images.map(b=>`<img src="data:image/png;base64,${b}">`).join('')}</div>`;
  if (m.thinking) body += `<details class="think" ${streaming && !m.content ? 'open' : ''}><summary>${streaming && !m.content ? 'Thinking…' : 'Thought process'}</summary><div>${esc(m.thinking)}</div></details>`;
  if (m.role === 'user') body += `<div class="content">${esc(m.content)}</div>`;
  else body += `<div class="content ${streaming?'cursor':''}">${md(m.content || '')}</div>`;
  if (m.error) body += `<div class="err">${esc(m.error)}</div>`;
  let meta = '';
  if (m.role === 'assistant' && !streaming){
    meta = `<div class="meta">${m.stats ? `<span>${m.stats}</span>` : ''}<button data-copy="${i}">Copy</button>${i === chat().messages.length-1 ? `<button data-regen>Regenerate</button>` : ''}</div>`;
  }
  return `<div class="msg ${m.role}"><div class="av">${m.role==='user'?'Y':'R'}</div><div class="body"><div class="who">${esc(who)}</div>${body}${meta}</div></div>`;
}
function renderThread(){
  const c = chat();
  if (!c || !c.messages.length){
    const names = models.slice(0,1).map(m=>m.name)[0];
    $('#thread').innerHTML = `<div class="empty"><svg viewBox="0 0 32 32"><path d="M4 24 L10 9 L18 6 L27 13 L29 24 Z" fill="#d4a373"/></svg>
      <h2>${models.length ? 'What can I help with?' : 'No models yet'}</h2>
      <div>${models.length ? 'Chatting with <b>'+esc($('#model').value||names||'')+'</b> locally on your machine.' : 'Open <b>Models</b> to download one or import your Ollama models.'}</div>
      ${models.length ? `<div class="chips">${['Explain how a CPU works','Write a Python script to rename files','Give me 5 dinner ideas','Summarize the plot of Hamlet'].map(t=>`<button class="chip">${t}</button>`).join('')}</div>` : `<div class="chips"><button class="chip" onclick="openModels()">Open Models</button></div>`}
    </div>`;
    return;
  }
  $('#thread').innerHTML = c.messages.map((m,i) => msgHTML(m, i, false)).join('');
  scrollDown(true);
}
$('#thread').onclick = e => {
  if (e.target.classList.contains('chip') && e.target.textContent !== 'Open Models'){ $('#input').value = e.target.textContent; send(); }
  if (e.target.classList.contains('copy')){ navigator.clipboard.writeText(e.target.nextElementSibling.textContent); e.target.textContent='copied'; setTimeout(()=>e.target.textContent='copy',1200) }
  if (e.target.dataset.copy !== undefined){ navigator.clipboard.writeText(chat().messages[+e.target.dataset.copy].content); toast('Copied') }
  if (e.target.dataset.regen !== undefined){ const c = chat(); c.messages.pop(); save(); renderThread(); generate() }
};
function scrollDown(force){ const el = $('#msgs'); if (force || el.scrollHeight - el.scrollTop - el.clientHeight < 160) el.scrollTop = el.scrollHeight }

/* ---------- sending ---------- */
async function send(){
  if (controller) { controller.abort(); return }
  const text = $('#input').value.trim();
  if (!text && !pendingImages.length) return;
  if (!$('#model').value){ toast('Download or import a model first'); openModels(); return }
  if (!chat()) newChat();
  const c = chat();
  c.model = $('#model').value;
  c.messages.push({ role:'user', content:text, images: pendingImages.length ? pendingImages.slice() : undefined });
  if (c.title === 'New chat') c.title = text.slice(0, 48) || 'Image';
  $('#input').value = ''; autosize(); pendingImages = []; renderPending();
  save(); renderChats(); renderThread();
  generate();
}
async function generate(){
  const c = chat();
  const model = $('#model').value;
  const msgs = [];
  if (settings.system.trim()) msgs.push({ role:'system', content: settings.system });
  for (const m of c.messages) msgs.push({ role:m.role, content:m.content, ...(m.images ? {images:m.images} : {}) });
  const reply = { role:'assistant', content:'', thinking:'', model };
  c.messages.push(reply);
  const el = document.createElement('div'); $('#thread').appendChild(el);
  const draw = (streaming) => { el.innerHTML = msgHTML(reply, c.messages.length-1, streaming); scrollDown() };
  reply.content = ''; draw(true);
  el.querySelector('.content').innerHTML = '<span style="color:var(--dim)">Loading model…</span>';
  controller = new AbortController(); setSending(true);
  const body = { model, messages: msgs, stream: true, keep_alive: settings.keep,
    options: { temperature: +settings.temperature, num_ctx: +settings.ctx, ...(+settings.max > 0 ? {num_predict: +settings.max} : {}) } };
  if (settings.think) body.think = settings.think === 'on';
  let last = 0;
  try {
    const r = await fetch('/api/chat', { method:'POST', body: JSON.stringify(body), signal: controller.signal });
    if (!r.ok){ const j = await r.json().catch(()=>({})); throw new Error(j.error || r.statusText) }
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true){
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl+1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.error) throw new Error(ev.error);
        if (ev.message?.content) reply.content += ev.message.content;
        if (ev.message?.thinking) reply.thinking += ev.message.thinking;
        if (ev.done){
          const s = ev.eval_duration ? (ev.eval_count / (ev.eval_duration/1e9)).toFixed(1) : null;
          reply.stats = `${ev.eval_count} tokens${s ? ` · ${s} tok/s` : ''}${ev.load_duration > 5e8 ? ` · loaded in ${(ev.load_duration/1e9).toFixed(1)}s` : ''}`;
        }
      }
      const now = performance.now(); if (now - last > 50){ draw(true); last = now }
    }
  } catch (e) {
    if (e.name !== 'AbortError') reply.error = e.message; else reply.stats = 'stopped';
  }
  controller = null; setSending(false);
  if (!reply.thinking) delete reply.thinking;
  save(); renderThread(); refreshStatus();
}
function setSending(on){ const b = $('#send'); b.classList.toggle('stop', on); b.textContent = on ? '■' : '➤'; b.title = on ? 'Stop' : 'Send' }
$('#send').onclick = send;
const autosize = () => { const t = $('#input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 240) + 'px' };
$('#input').oninput = autosize;
$('#input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send() } };

/* images */
$('#attach').onclick = () => $('#file').click();
$('#file').onchange = async e => { for (const f of e.target.files) pendingImages.push(await toB64(f)); e.target.value=''; renderPending();
  const m = models.find(m => m.name === $('#model').value); if (m && !m.vision) toast('This model has no vision projector - images may be ignored', 4000) };
const toB64 = f => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(f) });
function renderPending(){ $('#pending').innerHTML = pendingImages.map((b,i)=>`<div class="pi"><img src="data:image/png;base64,${b}"><button data-rm="${i}">✕</button></div>`).join('') }
$('#pending').onclick = e => { if (e.target.dataset.rm){ pendingImages.splice(+e.target.dataset.rm,1); renderPending() } };
document.addEventListener('paste', async e => { for (const it of e.clipboardData?.items || []) if (it.type.startsWith('image/')){ pendingImages.push(await toB64(it.getAsFile())); renderPending() } });

/* ---------- models ---------- */
async function loadModels(){
  const r = await fetch('/api/tags').then(r=>r.json());
  models = r.models;
  const sel = $('#model'); const prev = sel.value || store.get('model', '');
  sel.innerHTML = models.length ? models.map(m => `<option value="${esc(m.name)}" ${m.unsupported ? 'disabled' : ''}>${esc(m.name)}  (${fmtSize(m.size)})${m.unsupported ? '  - can\'t load (Ollama-only format)' : ''}</option>`).join('') : '<option value="">No models installed</option>';
  const ok = models.filter(m => !m.unsupported);
  sel.value = ok.some(m => m.name === prev) ? prev : (ok[0]?.name || '');
  onModelChange();
  renderInstalled();
}
function onModelChange(){
  store.set('model', $('#model').value);
  const m = models.find(m => m.name === $('#model').value);
  $('#visionTag').style.display = m?.vision ? '' : 'none';
  const c = chat(); if (c && !c.messages.length) renderThread();
}
$('#model').onchange = onModelChange;
function renderInstalled(){
  $('#installed').innerHTML = models.length ? models.map(m => `<div class="row"><span class="n">${esc(m.name)}</span>
    ${m.vision ? '<span class="tag">vision</span>' : ''}${m.unsupported ? `<span class="tag" style="color:var(--danger);border-color:#5a2e24" title="${esc(m.unsupported)}">can't load</span>` : ''}<span class="tag">${fmtSize(m.size)}</span>
    <span class="d">${esc([m.details.family, m.details.parameter_size, m.details.quantization_level].filter(Boolean).join(' · '))} ${m.source ? '· '+esc(m.source) : ''}</span>
    <button class="btn" data-use="${esc(m.name)}" ${m.unsupported ? 'disabled' : ''}>Use</button><button class="btn danger" data-rmm="${esc(m.name)}">Delete</button></div>`).join('')
    : '<div style="color:var(--dim)">Nothing installed yet.</div>';
}
async function loadCatalog(){
  const r = await fetch('/api/catalog').then(r=>r.json());
  $('#catalog').innerHTML = r.models.map(m => `<div class="row"><span class="n">${esc(m.name)}</span><span class="d">${esc(m.description)}</span>
    ${m.installed ? '<span class="tag">installed</span>' : `<button class="btn" data-pull="${esc(m.name)}">Download</button>`}</div>`).join('');
}
function openModels(){ $('#modelsModal').classList.add('open'); loadModels(); loadCatalog() }
window.openModels = openModels;
$('#openModels').onclick = openModels;
$('#modelsModal').onclick = async e => {
  const t = e.target;
  if (t.dataset.use){ $('#model').value = t.dataset.use; onModelChange(); $('#modelsModal').classList.remove('open') }
  if (t.dataset.rmm){
    if (!confirm(`Delete ${t.dataset.rmm}?\nFiles Rock downloaded are removed from disk. Imported files (e.g. from Ollama) are only removed from the list.`)) return;
    const r = await fetch('/api/delete', { method:'DELETE', body: JSON.stringify({ model: t.dataset.rmm }) }).then(r=>r.json());
    toast(r.error || 'Deleted'); loadModels(); loadCatalog();
  }
  if (t.dataset.pull) pullModel(t.dataset.pull);
};
$('#pullBtn').onclick = () => $('#pullName').value.trim() && pullModel($('#pullName').value.trim());
$('#pullName').onkeydown = e => { if (e.key === 'Enter') $('#pullBtn').click() };
async function pullModel(name){
  const box = document.createElement('div'); box.style.marginBottom = '10px';
  box.innerHTML = `<div class="flex"><b>${esc(name)}</b><span class="d" style="color:var(--dim);font-size:13px">starting…</span></div><div class="prog"><i></i></div>`;
  $('#pullStatus').prepend(box);
  const label = box.querySelector('.d'), bar = box.querySelector('i');
  try {
    const r = await fetch('/api/pull', { method:'POST', body: JSON.stringify({ model:name, stream:true }) });
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true){
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true }); let nl;
      while ((nl = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0,nl).trim(); buf = buf.slice(nl+1); if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.error) throw new Error(ev.error);
        if (ev.total){ bar.style.width = (100*ev.completed/ev.total).toFixed(1)+'%'; label.textContent = `${ev.status} - ${fmtSize(ev.completed)} / ${fmtSize(ev.total)}` }
        else label.textContent = ev.status;
      }
    }
    if (label.textContent !== 'success') throw new Error(r.ok ? 'download stopped' : (await r.text()));
    bar.style.width = '100%'; label.textContent = 'done ✓'; toast(`${name} is ready`);
    await loadModels(); loadCatalog();
    const m = models.find(m => m.name === name.toLowerCase()); if (m){ $('#model').value = m.name; onModelChange() }
  } catch (e) { label.textContent = 'Error: ' + e.message; label.style.color = 'var(--danger)' }
}
$('#importOllama').onclick = async () => {
  const r = await fetch('/api/import-ollama', { method:'POST', body:'{}' }).then(r=>r.json());
  toast(r.imported?.length ? `Imported: ${r.imported.join(', ')}` : (r.already?.length ? 'Already imported' : 'No Ollama models found'), 4000);
  loadModels(); loadCatalog();
};
$('#importBtn').onclick = async () => {
  const path = $('#importPath').value.trim().replace(/^"|"$/g, ''); if (!path) return;
  const r = await fetch('/api/import', { method:'POST', body: JSON.stringify({ path }) }).then(r=>r.json());
  toast(r.error || `Added ${r.name}`); if (!r.error){ $('#importPath').value=''; loadModels() }
};
$('#unload').onclick = async () => { await fetch('/api/unload', { method:'POST', body:'{}' }); toast('Model unloaded'); refreshStatus() };

/* ---------- settings ---------- */
function openSettings(){
  $('#sSystem').value = settings.system; $('#sTemp').value = settings.temperature; $('#sTempV').textContent = settings.temperature;
  $('#sCtx').value = settings.ctx; $('#sMax').value = settings.max; $('#sThink').value = settings.think; $('#sKeep').value = settings.keep;
  $('#settingsModal').classList.add('open');
}
$('#openSettings').onclick = openSettings;
$('#sTemp').oninput = e => $('#sTempV').textContent = e.target.value;
for (const [id, key] of [['#sSystem','system'],['#sTemp','temperature'],['#sCtx','ctx'],['#sMax','max'],['#sThink','think'],['#sKeep','keep']])
  $(id).addEventListener('change', e => { settings[key] = e.target.value; store.set('settings', settings) });
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('.modal').classList.remove('open'));
document.querySelectorAll('.modal').forEach(m => m.addEventListener('mousedown', e => { if (e.target === m) m.classList.remove('open') }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal.open').forEach(m => m.classList.remove('open')) });

/* ---------- status ---------- */
async function refreshStatus(){
  try {
    const s = await fetch('/api/status').then(r=>r.json());
    $('#ver').textContent = 'v' + s.version;
    $('#modelsDir').textContent = s.models_dir;
    const dot = $('#dot');
    if (s.install.state === 'installing'){ dot.className='dot warn'; $('#statusText').textContent = s.install.message + (s.install.total ? ` ${(100*s.install.completed/s.install.total).toFixed(0)}%` : '') }
    else if (s.install.state === 'error'){ dot.className='dot'; dot.style.background='var(--danger)'; $('#statusText').textContent = 'Engine download failed: ' + s.install.message + ' (check your internet and restart Rock)' }
    else if (!s.engine_installed){ dot.className='dot warn'; $('#statusText').textContent = 'Engine not installed' }
    else if (s.loaded){ dot.className='dot on'; $('#statusText').textContent = 'Loaded: ' + s.loaded }
    else { dot.className='dot'; $('#statusText').textContent = 'Ready · no model loaded' }
    const e = s.engine; $('#engineInfo').textContent = e ? `Engine: llama.cpp ${e.tag} (${e.backend}) · data folder: ${s.home}` : '';
  } catch { $('#dot').className='dot'; $('#statusText').textContent = 'Server offline' }
}

(async function init(){
  await refreshStatus();
  await loadModels().catch(()=>{});
  if (!models.length) { const r = await fetch('/api/import-ollama', { method:'POST', body:'{}' }).then(r=>r.json()).catch(()=>({}));
    if (r.imported?.length){ toast(`Found your Ollama models: ${r.imported.join(', ')}`, 5000); await loadModels() } }
  if (!chat()) current = chats[0]?.id || null;
  renderChats(); renderThread();
  setInterval(refreshStatus, 4000);
  $('#input').focus();
})();
</script>
